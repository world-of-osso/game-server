[workspace]
resolver = "2"
members = ["crates/server", "crates/client", "crates/integration-tests", "crates/los", "crates/navigation"]
exclude = ["vendor/bevy_replicon", "vendor/lightyear_replication", "vendor/recastnavigation-sys"]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[profile.dev]
incremental = true

[profile.sim]
inherits = "release"
debug-assertions = true
debug = 1
incremental = true

# Optimize deps in debug builds (Bevy is unusably slow at opt-level 0)
[profile.dev.package."*"]
opt-level = 2

[patch."https://github.com/world-of-osso/shared-protocol.git"]
shared = { path = "../shared-protocol" }

[patch.crates-io]
# Modern clang/CMake compatibility; algorithms remain pinned to 1.0.3 source.
recastnavigation-sys = { path = "vendor/recastnavigation-sys" }
bevy_replicon = { path = "vendor/bevy_replicon" }
# Per-client server disconnect; see ../shared-protocol/vendor/lightyear_netcode/UPSTREAM.md.
lightyear_netcode = { path = "../shared-protocol/vendor/lightyear_netcode" }
# Same UDP client queue provisioning as the native client; server listener unchanged.
lightyear_udp = { path = "../shared-protocol/vendor/lightyear_udp" }
lightyear_replication = { path = "vendor/lightyear_replication" }

# The bake parses every model of a tile and the real-geometry tests bake tiles;
# unoptimized both take minutes.
[profile.dev.package.los]
opt-level = 2

[profile.dev.package.navigation]
opt-level = 2
