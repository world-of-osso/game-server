[workspace]
resolver = "2"
members = ["crates/server", "crates/client", "crates/integration-tests"]
exclude = ["vendor/bevy_replicon", "vendor/lightyear_replication"]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[profile.dev]
incremental = true

# Optimize deps in debug builds (Bevy is unusably slow at opt-level 0)
[profile.dev.package."*"]
opt-level = 2

[patch."https://github.com/world-of-osso/shared-protocol.git"]
shared = { path = "../shared-protocol" }

[patch.crates-io]
bevy_replicon = { path = "vendor/bevy_replicon" }
lightyear_replication = { path = "vendor/lightyear_replication" }
