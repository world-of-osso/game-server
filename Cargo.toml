[workspace]
resolver = "2"
members = ["crates/shared", "crates/server", "crates/client", "crates/integration-tests"]

[workspace.package]
edition = "2024"
rust-version = "1.89"

# Optimize deps in debug builds (Bevy is unusably slow at opt-level 0)
[profile.dev.package."*"]
opt-level = 2

[patch."https://github.com/world-of-osso/shared-protocol.git"]
shared = { path = "crates/shared" }
