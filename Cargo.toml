[workspace]
resolver = "2"
members = ["crates/server-spell-scripts", "crates/server-combat", "crates/server-admin", "crates/server-core", "crates/server-follower-policy", "crates/server-map-rules", "crates/server-pet-battle", "crates/server-spell-tests", "crates/server-combat-tests", "crates/server-simulation", "crates/server-follower-apl", "crates/server-catalog", "crates/server", "crates/client", "crates/integration-tests", "crates/los", "crates/navigation"]
exclude = ["vendor/bevy_replicon", "vendor/lightyear_replication", "vendor/recastnavigation-sys"]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[profile.dev]
incremental = true

# Optimize deps in debug builds (Bevy is unusably slow at opt-level 0)
[profile.dev.package."*"]
opt-level = 2

# Gameplay and generic Bevy code are instantiated in the server crates. Dependency
# optimization alone leaves these hot paths unoptimized: dev-built private servers ran
# 6-10 ticks/s (2026-10-29). The test profile inherits these. Keep assertions/overflow
# checks; limited debug info avoids full test DWARF.
[profile.dev.package.server]
opt-level = 2
debug = 1

[profile.dev.package.server-combat]
opt-level = 2
debug = 1

[profile.dev.package.server-core]
opt-level = 2
debug = 1

[profile.dev.package.server-admin]
opt-level = 2
debug = 1

[profile.dev.package.server-follower-policy]
opt-level = 2
debug = 1

[profile.dev.package.server-map-rules]
opt-level = 2
debug = 1

[profile.dev.package.server-pet-battle]
opt-level = 2
debug = 1

[profile.dev.package.server-catalog]
opt-level = 2
debug = 1

[profile.dev.package.server-simulation]
opt-level = 2
debug = 1

[profile.dev.package.server-follower-apl]
opt-level = 2
debug = 1

[profile.dev.package.server-spell-scripts]
opt-level = 2
debug = 1

[profile.dev.package.server-combat-tests]
opt-level = 2
debug = 1

[profile.dev.package.server-spell-tests]
opt-level = 2
debug = 1

# Headless seeded batches need optimized gameplay while retaining native assertions.
[profile.sim]
inherits = "release"
debug-assertions = true
debug = 1
incremental = true

[patch."https://github.com/world-of-osso/shared-protocol.git"]
shared = { path = "../shared-protocol" }

[patch.crates-io]
# Clang/CMake compatibility and Recast adjacency index fix; see vendor/recastnavigation-sys/UPSTREAM.md.
recastnavigation-sys = { path = "vendor/recastnavigation-sys" }
bevy_replicon = { path = "vendor/bevy_replicon" }
# Per-client server disconnect; see ../shared-protocol/vendor/lightyear_netcode/UPSTREAM.md.
lightyear_netcode = { path = "../shared-protocol/vendor/lightyear_netcode" }
# Same UDP client queue provisioning as the native client; server listener unchanged.
lightyear_udp = { path = "../shared-protocol/vendor/lightyear_udp" }
lightyear_replication = { path = "vendor/lightyear_replication" }

# The bake parses every model of a tile and the real-geometry tests bake tiles;
# unoptimized both take minutes.
[profile.dev.package.los]
opt-level = 2

[profile.dev.package.navigation]
opt-level = 2
