[package]
name = "los"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Raw ADT/chunk records serve runtime liquid; M2/WMO stay bake-only without presentation features.
wow-chunk = { git = "https://github.com/world-of-osso/wow-formats.git", rev = "2a91b2242dbb1cf0e0217958a973b527b80191f1", default-features = false }
wow-m2 = { git = "https://github.com/world-of-osso/wow-formats.git", rev = "2a91b2242dbb1cf0e0217958a973b527b80191f1", default-features = false, features = ["animation", "materials"], optional = true }
wow-wmo = { git = "https://github.com/world-of-osso/wow-formats.git", rev = "2a91b2242dbb1cf0e0217958a973b527b80191f1", default-features = false, optional = true }
wow-adt = { git = "https://github.com/world-of-osso/wow-formats.git", rev = "2a91b2242dbb1cf0e0217958a973b527b80191f1", default-features = false }
# Bake math: the glam that bevy 0.19 re-exports, so its Vec3 is `shared::los::Vec3`.
glam = "0.32"
# The LOS runtime the bake writes for (`shared::los`).
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "7ccaa40b3736c9d2d962dc2bf04932238d873716" }
# Bake only: spawned creature displays from world.db and model names from the listfile.
rusqlite = { version = "0.35", features = ["bundled"], optional = true }

[features]
bake = ["dep:rusqlite", "dep:wow-m2", "dep:wow-wmo"]

[[bin]]
name = "los-bake"
path = "src/bin/los-bake.rs"
required-features = ["bake"]

[dev-dependencies]
tempfile = "3"
