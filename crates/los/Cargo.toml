[package]
name = "los"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Bake math: the glam that bevy 0.19 re-exports, so its Vec3 is `shared::los::Vec3`.
glam = "0.32"
# The LOS runtime the bake writes for (`shared::los`).
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "8c16175ef1a8c2296f9a7bd3a712b9d9241966d3" }
# Bake only: spawned creature displays from world.db and model names from the listfile.
rusqlite = { version = "0.35", features = ["bundled"], optional = true }

[features]
bake = ["dep:rusqlite"]

[[bin]]
name = "los-bake"
path = "src/bin/los-bake.rs"
required-features = ["bake"]

[dev-dependencies]
tempfile = "3"
