[package]
name = "los"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Shared geometry metadata only; eye posing needs animation, never rendering emitters/composites.
wow-chunk = { git = "https://github.com/world-of-osso/wow-formats.git", rev = "ed180cecd7228471944dcdf1d427468e5cc6e7b5", default-features = false, optional = true }
wow-m2 = { git = "https://github.com/world-of-osso/wow-formats.git", rev = "ed180cecd7228471944dcdf1d427468e5cc6e7b5", default-features = false, features = ["animation", "materials"], optional = true }
wow-wmo = { git = "https://github.com/world-of-osso/wow-formats.git", rev = "ed180cecd7228471944dcdf1d427468e5cc6e7b5", default-features = false, optional = true }
wow-adt = { git = "https://github.com/world-of-osso/wow-formats.git", rev = "ed180cecd7228471944dcdf1d427468e5cc6e7b5", default-features = false, optional = true }
# Bake math: the glam that bevy 0.19 re-exports, so its Vec3 is `shared::los::Vec3`.
glam = "0.32"
# The LOS runtime the bake writes for (`shared::los`).
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "7ccaa40b3736c9d2d962dc2bf04932238d873716" }
# Bake only: spawned creature displays from world.db and model names from the listfile.
rusqlite = { version = "0.35", features = ["bundled"], optional = true }

[features]
bake = ["dep:rusqlite", "dep:wow-chunk", "dep:wow-m2", "dep:wow-wmo", "dep:wow-adt"]

[[bin]]
name = "los-bake"
path = "src/bin/los-bake.rs"
required-features = ["bake"]

[dev-dependencies]
tempfile = "3"
