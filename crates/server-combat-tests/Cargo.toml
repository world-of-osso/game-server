[package]
name = "server-combat-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Test-only consumer: normal workspace builds never activate fixture support.
[dev-dependencies]
server = { path = "../server", features = ["test-support"] }
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_state"] }
# Actual native combat broadcasts and requests; retain canonical protocol identities.
lightyear = { version = "0.28", features = ["server", "netcode", "replication", "udp"] }
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "1660f5bf4a8a18b8a4d6d0c8cc0962fc62ba0024" }
# Read-only installed attack-time rows used by native cadence cases.
rusqlite = { version = "0.35", features = ["bundled"] }
# Preserve the existing cadence fixture's ordinary spawn RNG type.
rand = "0.8"
