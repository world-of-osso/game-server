[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "e25c79d" }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_log", "bevy_state",
] }
lightyear = { version = "0.26", features = ["server", "netcode", "replication", "udp"] }
redb = "3"
serde = { version = "1", features = ["derive"] }
bitcode = "0.6"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
peercred-ipc = { git = "https://github.com/Osso/peercred-ipc.git", tag = "v0.2.0" }
rusqlite = { version = "0.35", features = ["bundled"] }

[[bin]]
name = "game-server"
path = "src/main.rs"

[[bin]]
name = "game-server-admin"
path = "src/bin/admin.rs"

[dev-dependencies]
tempfile = "3"
