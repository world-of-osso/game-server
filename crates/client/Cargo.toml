[package]
name = "client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "e25c79d" }
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_state"] }
lightyear = { version = "0.28", features = ["client", "netcode", "replication", "udp"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"

[[bin]]
name = "game-cli"
path = "src/bin/game_cli.rs"
