[package]
name = "client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "1660f5bf4a8a18b8a4d6d0c8cc0962fc62ba0024" }
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_state"] }
lightyear = { version = "0.28", features = ["client", "netcode", "replication", "udp"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"

[dev-dependencies]
# Inspect the owning player's replicated position for the private combat workload.
bevy_replicon = { version = "0.41.1", default-features = false, features = ["client"] }

[[bin]]
name = "game-cli"
path = "src/bin/game_cli.rs"
