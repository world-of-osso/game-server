[package]
name = "integration-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# No lib — this crate only contains integration tests
[lib]
path = "src/lib.rs"

[dependencies]
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "5fe2ff2ec050b0a1662c74f88f8a274964f264c9" }
bevy = { version = "0.19", default-features = false, features = [
    "bevy_log", "bevy_state",
] }
lightyear = { version = "0.28", features = [
    "client", "server", "replication", "crossbeam", "raw_connection",
] }
lightyear_replication = { version = "0.28", features = ["test_diagnostics"] }
lightyear_crossbeam = "0.28"
lightyear_raw_connection = { version = "0.28", features = ["client", "server"] }
serde = { version = "1", features = ["derive"] }
bitcode = "0.6"
