[package]
name = "server-spell-scripts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Native rating coefficients for haste-scaled Shadow Dance duration.
server-catalog = { path = "../server-catalog" }
server-combat = { path = "../server-combat" }
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_state"] }
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "cff29ac9376428fb298647d3899787a3d4033c6f" }

[features]
test-support = ["server-combat/test-support"]

[dev-dependencies]
server-combat = { path = "../server-combat", features = ["test-support"] }
