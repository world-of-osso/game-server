[package]
name = "server-simulation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# This package has no production code or normal dependency enabling fixture behavior.
[dev-dependencies]
server-combat = { path = "../server-combat", features = ["test-support"] }
server-spell-scripts = { path = "../server-spell-scripts", features = ["test-support"] }
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_state"] }
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "feaf01ac7d170a23abfe3759f982f9baad9066ee" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8"
tempfile = "3"
rusqlite = { version = "0.35", features = ["bundled"] }
# Exact frozen AssistedCombat types/rules shared with the core fixture bindings.
game-engine-core = { git = "ssh://git@github.com/world-of-osso/game-engine.git", rev = "21a30a47493d3609d7ad7ce64ddb248294f1cab5", default-features = false }
