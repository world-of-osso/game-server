[package]
name = "server-simulation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# This package has no production code or normal dependency enabling fixture behavior.
[dev-dependencies]
server-combat = { path = "../server-combat", features = ["test-support"] }
server-spell-scripts = { path = "../server-spell-scripts", features = ["test-support"] }
server-follower-apl = { path = "../server-follower-apl" }
navigation = { path = "../navigation" }
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_state"] }
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "cff29ac9376428fb298647d3899787a3d4033c6f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8"
# SHA-256 provenance of the measurement world snapshot in replay results.
sha2 = "0.10"
tempfile = "3"
rusqlite = { version = "0.35", features = ["bundled"] }
# Exact frozen AssistedCombat types/rules shared with the core fixture bindings.
game-engine-core = { git = "ssh://git@github.com/world-of-osso/game-engine.git", rev = "d39210394448439112c08b9183006e8355758677", default-features = false }
