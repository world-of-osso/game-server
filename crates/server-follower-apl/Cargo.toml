[package]
name = "server-follower-apl"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Production class-follower casting: the DPS parity harness's spec APL drivers.
[dependencies]
server-combat = { path = "../server-combat" }
server-spell-scripts = { path = "../server-spell-scripts" }
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "bevy_state"] }
shared = { git = "https://github.com/world-of-osso/shared-protocol.git", rev = "5fe2ff2ec050b0a1662c74f88f8a274964f264c9" }
serde_json = "1"

# Role tests spawn class followers through the native harness.
[dev-dependencies]
server-combat = { path = "../server-combat", features = ["test-support"] }
server-spell-scripts = { path = "../server-spell-scripts", features = ["test-support"] }
rusqlite = { version = "0.35", features = ["bundled"] }
